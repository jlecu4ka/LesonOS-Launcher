name: Build and Deploy

on:
  workflow_dispatch: # Запуск только вручную

jobs:
  # ЭТАП 1: Сборка под все системы
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false # Если Mac упадет, Windows и Linux продолжат сборку
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci
        shell: bash

      - name: Build & Publish to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always
        shell: bash

      # Сохраняем собранные файлы как артефакты
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: builds-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
          if-no-files-found: ignore

  # ЭТАП 2: Отправка на сервер (запустится только если сборка успешна)
  deploy:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-builds
          merge-multiple: true # Собирает все файлы из разных ОС в одну папку

      - name: Setup SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: 'just-a-placeholder-for-now'
          name: github_actions

      - name: Adding Known Hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to Server
        run: |
          # Копируем файлы без удаления самой папки (просто перезаписываем)
          scp all-builds/* ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/opt/sites/minecraft/builds/
